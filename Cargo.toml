[workspace]
members = ["crates/plumb-core", "crates/plumb-cli", "crates/plumb-ui"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.93"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/Karanjot786/Visualize_Storage"
authors = ["Karanjot786"]
keywords = ["disk-usage", "treemap", "storage", "hardlink", "deduplication"]
categories = ["command-line-utilities", "filesystem", "visualization"]

[workspace.dependencies]
dua-core = "=4.0.0"
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
