[package]
name = "plumb-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Disk accounting engine: scans a tree and reports what deleting it would actually free, modelling hardlinks, clones, sparse files and snapshots."

[dependencies]
dua-core.workspace = true
tiny-skia = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
toml = "0.9"

# The format-control features are pinned explicitly even though they are
# defaults: a transitive dependency enabling `big_endian` would silently
# rewrite the on-disk snapshot format under us.
rkyv = { version = "0.8.18", default-features = false, features = [
    "std", "alloc", "bytecheck", "little_endian", "aligned", "pointer_width_32" ] }
memmap2 = "0.9"
# xxh3 measures ~26x blake3 single-threaded on Apple Silicon; blake3 is used
# only to break an xxh3 collision, never as the primary digest.
xxhash-rust = { version = "0.8", features = ["xxh3"] }
blake3 = "1"
rayon = "1"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
# FSEvents. Deliberately not enabled on Linux: notify's backend there is
# inotify, which needs one watch per directory and blows past
# max_user_watches on a 240k-directory tree. Linux polls and diffs instead.
notify = "8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
# ReadDirectoryChangesW, which is what notify's Windows backend is.
notify = "8"

