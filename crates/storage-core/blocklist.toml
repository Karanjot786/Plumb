# Deny rules, embedded at build time and checked before anything is staged.
#
# Entries are resolved to (dev, ino) once at load. A candidate is denied when it
# or ANY of its ancestors matches one of those pairs, so `/SYSTEM/Library/x` is
# caught on case-insensitive APFS even though the string differs.
#
# A path that does not exist on this machine is simply inert.

# ---------------------------------------------------------------- macOS

[[deny]]
path = "/System"
reason = "system volume"

[[deny]]
path = "/Library"
reason = "system-wide library"

[[deny]]
path = "/private/var/db"
reason = "system database"

# `exact` on /usr, with its system subtrees denied individually below. A bare
# ancestor rule on /usr also refused /usr/local, where an installer may put an
# .app that `from_pkgutil` legitimately finds - and that bundle could then
# never be uninstalled. Making /usr alone exact would have unprotected
# /usr/bin and /usr/lib, which is far more than was needed.
[[deny]]
path = "/usr"
reason = "system prefix"
exact = true

[[deny]]
path = "/usr/bin"
reason = "system binaries"

[[deny]]
path = "/usr/sbin"
reason = "system binaries"

[[deny]]
path = "/usr/lib"
reason = "system libraries"

[[deny]]
path = "/usr/libexec"
reason = "system helpers"

[[deny]]
path = "/usr/share"
reason = "system data"

[[deny]]
path = "/usr/include"
reason = "system headers"

[[deny]]
path = "/bin"
reason = "system binaries"

[[deny]]
path = "/sbin"
reason = "system binaries"

# `exact`, or no application could ever be uninstalled: the ancestor walk in
# `reason_for` reaches /Applications from every bundle inside it, so
# `clean::plan` refused /Applications/Foo.app itself. The directory stays
# protected; the bundles inside it are the whole point of an uninstall.
[[deny]]
path = "/Applications"
reason = "installed applications"
exact = true

# `exact` denies the directory itself but not what is under it. Without it,
# every file on every external drive would be refused, since /Volumes is an
# ancestor of all of them. Volume roots stay protected by the mount-point check.
[[deny]]
path = "/Volumes"
reason = "mount root"
exact = true

[[deny]]
path = "/.vol"
reason = "volfs root"
exact = true

[[deny]]
path = "/media"
reason = "mount root"
exact = true

[[deny]]
path = "/mnt"
reason = "mount root"
exact = true

# ---------------------------------------------------------------- Linux

[[deny]]
path = "/boot"
reason = "boot partition"

[[deny]]
path = "/etc"
reason = "system configuration"

[[deny]]
path = "/lib"
reason = "system libraries"

[[deny]]
path = "/lib64"
reason = "system libraries"

# `exact` for the same reason as /usr: an installer may place an .app under
# /opt that `from_pkgutil` finds. Note this makes user-installed prefixes such
# as /opt/homebrew stageable - the same category as an application bundle,
# and still subject to the mount-point and package-ownership checks.
[[deny]]
path = "/opt"
reason = "system prefix"
exact = true

[[deny]]
path = "/proc"
reason = "kernel filesystem"

[[deny]]
path = "/sys"
reason = "kernel filesystem"

[[deny]]
path = "/dev"
reason = "device filesystem"

[[deny]]
path = "/run"
reason = "runtime state"

[[deny]]
path = "/var/lib"
reason = "package-manager state"

# ---------------------------------------------------------------- Windows

[[deny]]
path = 'C:\Windows'
reason = "system directory"

# WinSxS is report-only by design: removing a component store entry breaks
# servicing and Windows has no supported way to put one back.
[[deny]]
path = 'C:\Windows\WinSxS'
reason = "component store, report-only"

[[deny]]
path = 'C:\Program Files'
reason = "installed applications"

[[deny]]
path = 'C:\Program Files (x86)'
reason = "installed applications"

[[deny]]
path = 'C:\ProgramData'
reason = "system-wide application state"

[[deny]]
path = 'C:\$Recycle.Bin'
reason = "recycle bin"

[[deny]]
path = 'C:\System Volume Information'
reason = "volume metadata"
