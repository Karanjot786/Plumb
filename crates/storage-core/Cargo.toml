[package]
name = "storage-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
dua-core.workspace = true
tiny-skia = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
toml = "0.9"

# The format-control features are pinned explicitly even though they are
# defaults: a transitive dependency enabling `big_endian` would silently
# rewrite the on-disk snapshot format under us.
rkyv = { version = "0.8.18", default-features = false, features = [
    "std", "alloc", "bytecheck", "little_endian", "aligned", "pointer_width_32" ] }
memmap2 = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
